default:
  min_missing_gap_s: 0.07     # cũ: 2 frame
  max_missing_gap_s: 0.5      # cũ: 15 frame
  max_frame_step_s: 0.1       # cũ: 3 frame
  max_merge_gap_s: 1.0        # cũ: 30 frame
  dup_min_s: 0.33             # cũ: dup_min_frames = 10
  max_speed: 15               # cỡ box/giây (cũ: max_disp_ratio 0.5/frame)
  merge_gap_cost_s: 1.5       # chi phí mỗi giây gap (cũ: 0.05/frame)
  max_scale: 1.8         # tỉ lệ đổi kích thước giữa hai box liên tiếp
  dup_iou: 0.7
  dup_min_ratio: 0.6
  skip_occluded_gap: false
  skip_occluded_scale: true
  max_merge_dist: 2.0    # khoảng cách dự đoán / kích thước box
  max_merge_scale: 2.0   # tỉ lệ kích thước tối đa giữa box cuối của A và box đầu của B
  merge_max_cost: 1.6    # chi phí tối đa để chấp nhận ghép cặp
  min_merge_track_len: 4 # số frame visible tối thiểu để cho phép ghép nối track
  border_margin: 30      # px: box cách mép khung nhỏ hơn mức này coi là chạm mép
  border_penalty: 2.0    # cộng vào chi phí khi A kết thúc và B bắt đầu ở cùng một mép
  swap_min_disp: 0.0
  swap_min_sep: 0.1
  swap_max_sep: 3.0
  swap_cross_ratio: 0.5
  compensate_camera: true
  cam_min_tracks: 4