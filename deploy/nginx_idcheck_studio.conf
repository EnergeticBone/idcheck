# Cấu hình Nginx Reverse Proxy cho idcheck QA Studio
# Đặt file này tại: /etc/nginx/sites-available/idcheck_studio.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/idcheck_studio.conf /etc/nginx/sites-enabled/
# Kiểm tra: sudo nginx -t && sudo systemctl reload nginx

# Giới hạn tần suất request tránh DDOS / brute-force
limit_req_zone $binary_remote_addr zone=idcheck_limit:10m rate=30r/s;

server {
    listen 80;
    server_name studio.trantuli.id.vn; # Thay thế bằng domain hoặc IP của bạn

    # Giới hạn kích thước tải lên video / zip (350MB)
    client_max_body_size 350M;

    # Gzip nén các file tĩnh để tải nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Phục vụ file tĩnh trực tiếp từ đĩa (tiết kiệm CPU cho server Python)
    location ~ ^/(style\.css|app\.js|favicon\.ico)$ {
        root /home/tran-tuan-kinh/idcheck/studio/static;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy tới backend Python
    location / {
        limit_req zone=idcheck_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;

        # Header chuyển tiếp IP thực
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout tăng lên 300s để upload video / zip lớn không bị ngắt giữa chừng
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Tắt buffer tạm để stream video frame mượt mà
        proxy_buffering off;
    }
}
