default:
  min_missing_gap_s: 0.2
  max_missing_gap_s: 1.0
  max_frame_step_s: 0.1
  max_merge_gap_s: 1.2
  dup_min_s: 0.33
  max_speed: 10.0
  merge_gap_cost_s: 0.4
  max_scale: 2.2
  dup_iou: 0.7
  dup_min_ratio: 0.6
  skip_occluded_gap: false
  skip_occluded_scale: true
  max_merge_dist: 2.0
  max_merge_scale: 2.0
  merge_max_cost: 2.5
  min_merge_track_len: 3
  border_margin: 30
  border_penalty: 3.0
  swap_min_disp: 0.0
  swap_min_sep: 0.05
  swap_max_sep: 3.0
  swap_cross_ratio: 0.5
  compensate_camera: true
  cam_min_tracks: 4
  # Horizon-Aware Filter (lọc nhiễu box siêu nhỏ ở dải chân trời xe tự hành)
  enable_horizon_filter: true
  horizon_band: [0.32, 0.54]     # Dải chân trời camera (32% - 54% chiều cao ảnh)
  horizon_min_h: 20              # Chiều cao tối thiểu ở dải chân trời (px)
  horizon_min_w: 18              # Chiều rộng tối thiểu ở dải chân trời (px)
  horizon_min_area: 360          # Diện tích tối thiểu (px^2)
  # Re-ID Size Gating Filter (kích thước tối thiểu để kích hoạt trích xuất đặc trưng Re-ID)
  reid_min_w: 20
  reid_min_h: 20
  reid_min_area: 380
classes:
  car:
    max_speed: 10.0
  truck:
    max_speed: 10.0
  other vehicle:
    max_speed: 10.0
